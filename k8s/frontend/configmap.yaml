apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: frontend
data:
  nginx.conf: |
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

  API_BASE_URL: "http://192.168.132.128:5000"
