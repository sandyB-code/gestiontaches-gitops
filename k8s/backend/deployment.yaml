
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mdianmareyah/app-stateful-flask:v0
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URI
              value: "postgresql://stateful-flask-user:stateful-flask-password@postgres.postgres.svc.cluster.local:5432/stateful-flask-db"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

