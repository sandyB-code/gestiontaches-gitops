name: Construire et publier le frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "k8s/frontend/**"
      - ".github/workflows/frontend-ci.yaml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Mettre à jour le tag d'image dans le manifeste
        run: |
          sed -i "s|image: .*/frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}|" \
            k8s/frontend/deployment.yaml

      - name: Commit et push le manifeste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/frontend/deployment.yaml

          if git diff --staged --quiet; then
            echo "Rien à committer"
            exit 0
          fi

          git commit -m "ci: mise à jour frontend ${{ github.sha }} [skip ci]"
          git push
